server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy inverso al API Gateway (zg5nh5Y, 05 sep 2026): el frontend llama
    # a rutas relativas /api/... (API_BASE="/api" en fetchAuth.js), nginx
    # las reenvia al gateway por DNS interno de compose. Mismo origen ->
    # sin CORS, sin mixed-content, alcanzable desde cualquier host (Tailscale
    # Funnel, dominio real, etc.), sin gastar un puerto de Funnel extra.
    # "^~" fuerza a nginx a usar este prefijo sin evaluar los regex de abajo
    # (asi un hipotetico /api/algo.js no cae en el bloque de cache). La barra
    # final en proxy_pass quita el "/api" -> el gateway recibe /auth/login,
    # /facturas/..., etc. (sus rutas reales, sin prefijo).
    location ^~ /api/ {
        proxy_pass http://gateway:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;          # keep-alive al upstream
        proxy_set_header Connection "";  # + SSE de /ia/chat/stream
        proxy_buffering off;             # SSE: entregar tokens a medida que llegan
        proxy_read_timeout 300s;         # timbrado real puede tardar (Finkok+CSD+PDF+MinIO)
        client_max_body_size 25m;        # uploads del Lector de Documentos
    }

    # SPA fallback: todas las demas rutas sirven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
