name: WhatsApp Bot — CI/CD

on:
  push:
    paths:
      - "backend/microservices/whatsapp_bot/**"
      - ".github/workflows/whatsapp-bot.yml"
  pull_request:
    paths:
      - "backend/microservices/whatsapp_bot/**"

env:
  IMAGE_NAME: cfdi-whatsapp-bot
  WORKDIR: backend/microservices/whatsapp_bot

jobs:
  lint-and-test:
    name: Lint + Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      postgres:
        # Misma version que ya usa el proyecto en docker-compose.yml.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "${{ env.WORKDIR }}/requirements.txt"

      - name: Install system deps (Tesseract)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa poppler-utils

      - name: Install Python deps
        working-directory: ${{ env.WORKDIR }}
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Lint (ruff)
        working-directory: ${{ env.WORKDIR }}
        run: |
          pip install ruff
          ruff check . --select E,W,F --ignore E501

      - name: Type check (mypy)
        working-directory: ${{ env.WORKDIR }}
        run: |
          pip install mypy types-redis
          mypy . --ignore-missing-imports --no-strict-optional

      - name: Bootstrap de base de datos (mismo camino que un ambiente nuevo real, #38)
        working-directory: ${{ env.WORKDIR }}
        env:
          WHATSAPP_TOKEN: test_token
          WHATSAPP_PHONE_NUMBER_ID: "123456789"
          WHATSAPP_VERIFY_TOKEN: test_verify
          INTERNAL_API_KEY: test_key
          JWT_SECRET: test_secret
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test"
          REDIS_URL: "redis://localhost:6379/2"
          FACTURACION_URL: "http://facturacion:8001"
          EMISOR_RFC_DEFAULT: "DNS010101AAA"
          ENVIRONMENT: "test"
        run: |
          python -c "
          import asyncio
          import models.schemas  # noqa: F401 - registra las tablas reales en Base.metadata
          from models.database import create_tables, stamp_head_si_es_ambiente_nuevo

          async def bootstrap():
              await create_tables()
              await stamp_head_si_es_ambiente_nuevo()

          asyncio.run(bootstrap())
          "

      - name: Run tests
        working-directory: ${{ env.WORKDIR }}
        env:
          WHATSAPP_TOKEN: test_token
          WHATSAPP_PHONE_NUMBER_ID: "123456789"
          WHATSAPP_VERIFY_TOKEN: test_verify
          INTERNAL_API_KEY: test_key
          JWT_SECRET: test_secret
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test"
          REDIS_URL: "redis://localhost:6379/2"
          FACTURACION_URL: "http://facturacion:8001"
          EMISOR_RFC_DEFAULT: "DNS010101AAA"
          ENVIRONMENT: "test"
        run: pytest tests/ -v --tb=short

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKDIR }}
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Descomentar para publicar en un registry:
      # - name: Login to registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      #
      # - name: Push image
      #   run: docker push ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
