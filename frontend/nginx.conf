server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy inverso al API Gateway (zg5nh5Y, 05 sep 2026): el frontend llama
    # a rutas relativas /api/... (API_BASE="/api" en fetchAuth.js), nginx
    # las reenvia al gateway por DNS interno de compose. Mismo origen ->
    # sin CORS, sin mixed-content, alcanzable desde cualquier host (Tailscale
    # Funnel, dominio real, etc.), sin gastar un puerto de Funnel extra.
    # "^~" fuerza a nginx a usar este prefijo sin evaluar los regex de abajo
    # (asi un hipotetico /api/algo.js no cae en el bloque de cache). La barra
    # final en proxy_pass quita el "/api" -> el gateway recibe /auth/login,
    # /facturas/..., etc. (sus rutas reales, sin prefijo).
    location ^~ /api/ {
        proxy_pass http://gateway:8000/;
        proxy_set_header Host $host;
        # Fix de seguridad (g4CnlY, 17 sep 2026): $proxy_add_x_forwarded_for
        # hace APPEND al X-Forwarded-For que traiga el cliente, no lo
        # reemplaza - un atacante que mande su propio X-Forwarded-For
        # llegaba intacto como primer valor de la lista (el Gateway/
        # auth_usuarios leen ese primer valor para rate-limit por IP).
        # $remote_addr es la IP del peer TCP que conecto DIRECTO a nginx -
        # nginx la determina el mismo a nivel de socket, el cliente no
        # puede falsificarla via headers. Se sobrescribe el valor completo
        # (no se encadena) para que no quede ningun rastro del XFF que el
        # cliente haya mandado.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;          # keep-alive al upstream
        proxy_set_header Connection "";  # + SSE de /ia/chat/stream
        proxy_buffering off;             # SSE: entregar tokens a medida que llegan
        proxy_read_timeout 300s;         # timbrado real puede tardar (Finkok+CSD+PDF+MinIO)
        client_max_body_size 25m;        # uploads del Lector de Documentos
    }

    # SPA fallback: todas las demas rutas sirven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html SIEMPRE revalida (reporte 189d - bug real encontrado en
    # prueba de usuario: el navegador sirvio un index.html viejo, del
    # reporte 188, apuntando a un bundle .js que ya no existia en el
    # servidor - "NaN MB / Invalid Date" en la lista y borrado con 404).
    # Causa raiz: index.html no tenia NINGUN Cache-Control explicito, asi
    # que el navegador aplicaba cacheo HEURISTICO propio (basado en
    # Last-Modified/ETag) y podia seguir sirviendolo desde su cache local
    # por horas/dias sin siquiera preguntarle al servidor. "no-cache" (NO
    # "no-store") es lo correcto aqui: el navegador SIGUE guardando una
    # copia, pero esta OBLIGADO a revalidarla con el servidor (If-None-
    # Match/If-Modified-Since) en cada carga antes de usarla - si nginx
    # responde 304 es gratis (sin bajar bytes), y si el archivo cambio
    # (nuevo build) se sirve la version nueva de inmediato. Los assets con
    # hash de mas abajo SI pueden cachearse agresivo porque su NOMBRE
    # cambia con el contenido - index.html es el UNICO archivo cuyo
    # nombre nunca cambia pero cuyo contenido si, por eso necesita esta
    # regla aparte. Se cubren las 2 rutas por las que se sirve
    # (`/index.html` explicito y `/` -> fallback de la SPA de arriba).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location = / {
        add_header Cache-Control "no-cache" always;
    }

    # Cache para assets estáticos CON HASH en el nombre (Vite: cambia el
    # archivo -> cambia el hash del nombre -> nunca hay ambiguedad de cual
    # version es, por eso "immutable" (nunca revalidar, nunca expira antes
    # de 1 año) es seguro aqui, a diferencia de index.html arriba.
    #
    # CORREGIDO (reporte 189d): antes esta regla usaba `expires 1y;` Y
    # `add_header Cache-Control ...` juntos - `expires` genera SU PROPIO
    # header Cache-Control internamente, y `add_header` en nginx AGREGA
    # (no reemplaza), asi que la respuesta real traia 2 headers
    # Cache-Control distintos a la vez (confirmado con curl -I antes de
    # corregir: "max-age=31536000" Y "public, immutable" por separado) -
    # ambiguo para cualquier cliente que no tolere headers duplicados. Un
    # solo `add_header` con todos los valores juntos evita el duplicado.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
    }
}
